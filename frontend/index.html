
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Task Manager</h1>
        <p class="subtitle">Керуйте своїми завданнями</p>

        <form id="task-form">
            <input
                type="text"
                id="task-input"
                placeholder="Введіть нове завдання..."
                maxlength="200"
                required
            >
            <button type="submit">Додати</button>
        </form>

        <h2>Мої завдання</h2>
        <p id="message"></p>
        <ul id="task-list"></ul>
    </main>

    <script src="script.js"></script>
</body>
</html>
